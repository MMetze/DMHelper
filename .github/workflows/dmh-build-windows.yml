name: DMHelper CI Windows Workflow

on:
  push:
    branches: [ master, feature/linux-port ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x64
            qt_arch: win64_msvc2022_64
            vcvars_arch: x64
            dmh_windows_arch: x64
            use_packaging_script: true
          - name: arm64
            qt_arch: win64_msvc2022_arm64_cross_compiled
            vcvars_arch: arm64
            dmh_windows_arch: arm64
            use_packaging_script: false

    defaults:
      run:
        shell: pwsh

    steps:
      # -------------------------
      # Checkout repository
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Install Qt (MSVC 2022)
      # -------------------------
      - name: Install Qt 6.10.1 (${{ matrix.target.name }}, MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          arch: ${{ matrix.target.qt_arch }}
          tools: 'tools_vcredist,qt.tools.vcredist_64 tools_vcredist,qt.tools.vcredist_msvc2022_x64 tools_ifw'
          cache: true
          modules: 'qtmultimedia qtnetworkauth qtimageformats'
          add-tools-to-path: 'true'
          archives: 'qttranslations qttools qtsvg qtbase opengl32sw d3dcompiler_47'

      # -------------------------
      # Ensure 7-Zip exists
      # (Windows runner already has it, but we assert it)
      # -------------------------
      - name: Verify 7-Zip
        run: |
          Test-Path "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            throw "7-Zip not found"
          }

      # -------------------------
      # Check the full file tree
      # -------------------------
      - name: Debug Workspace output pre-build
        working-directory: ${{ runner.workspace }}
        run: |
          echo 'runner.workspace === ${{ runner.workspace }}'
          echo 'github.workspace === ${{ github.workspace }}'
          echo ${{env.QT_ROOT_DIR}}
          Get-ChildItem -Recurse -File

      # -------------------------
      # Run build & deploy script
      # -------------------------
      - name: Build DMHelper x64 (MSVC Release)
        if: ${{ matrix.target.use_packaging_script }}
        working-directory: ${{ github.workspace }}/DMHelper
        run: |
          Get-ChildItem -Recurse -File -Filter "buildanddeploy_msvc64_cmake.ps1"
          "y" | pwsh -NoProfile -ExecutionPolicy Bypass -File buildanddeploy_msvc64_cmake.ps1

      - name: Build DMHelper arm64 (CMake)
        if: ${{ !matrix.target.use_packaging_script }}
        working-directory: ${{ github.workspace }}/DMHelper
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found" }

          $vsInstallDir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsInstallDir) { throw "Visual Studio with C++ tools not found" }

          $vsDevCmd = Join-Path $vsInstallDir "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) { throw "VsDevCmd.bat not found" }

          cmd /c "`"$vsDevCmd`" -arch=${{ matrix.target.vcvars_arch }} -host_arch=x64 && set" |
            ForEach-Object {
              if ($_ -match "^(.*?)=(.*)$") {
                [Environment]::SetEnvironmentVariable($matches[1], $matches[2])
              }
            }

          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "MSVC compiler not available"
          }

          $buildDir = "out\build\windows-${{ matrix.target.name }}-release"
          cmake -S src -B $buildDir -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DQt6_DIR="$env:QT_ROOT_DIR\lib\cmake\Qt6" `
            -DDMH_WINDOWS_ARCH=${{ matrix.target.dmh_windows_arch }}
          cmake --build $buildDir --config Release
      
      # -------------------------
      # Check the full file tree
      # -------------------------
      - name: Debug Workspace output post-build
        working-directory: ${{ runner.workspace }}
        run: |
          Get-ChildItem -Recurse -File

      # -------------------------
      # Smoke-test the built application
      # -------------------------
      - name: Smoke-test built application
        if: ${{ matrix.target.use_packaging_script }}
        working-directory: ${{ github.workspace }}/DMHelper
        run: |
          $exe = "bin64\packages\com.dmhelper.app\data\DMHelper.exe"
          if (-not (Test-Path $exe)) { throw "DMHelper.exe not found at $exe" }
          $output = & $exe --smoke-test --skip-opengl 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($null -ne $exitCode -and $exitCode -ne 0) { throw "Smoke test failed with exit code $exitCode" }
          if ($output -match '"passed"\s*:\s*false') { throw "Smoke test reported failures" }
        env:
          QT_QPA_PLATFORM: offscreen

      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload Installer
        if: ${{ matrix.target.use_packaging_script }}
        uses: actions/upload-artifact@v4
        with:
          name: DMHelper-Windows-Installer-${{ matrix.target.name }}
          path: |
            DMHelper/DMHelper-64-bit-release-Installer.exe
          if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

      - name: Upload ZIP Distribution
        if: ${{ matrix.target.use_packaging_script }}
        uses: actions/upload-artifact@v4
        with:
          name: DMHelper-Windows-Zip-${{ matrix.target.name }}
          path: |
            DMHelper/DMHelper-64-bit-release.zip
          if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

      - name: Upload ARM64 binary
        if: ${{ !matrix.target.use_packaging_script }}
        uses: actions/upload-artifact@v4
        with:
          name: DMHelper-Windows-${{ matrix.target.name }}-binary
          path: |
            DMHelper/out/build/windows-${{ matrix.target.name }}-release/DMHelper.exe
            DMHelper/out/build/windows-${{ matrix.target.name }}-release/Release/DMHelper.exe
          if-no-files-found: error
