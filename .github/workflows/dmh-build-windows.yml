name: DMHelper CI Windows Workflow

on:
  push:
    branches: [ master, feature/linux-port ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: x64
            qt_arch: win64_msvc2022_64
          - name: arm64
            qt_arch: win64_msvc2022_arm64_cross_compiled

    defaults:
      run:
        shell: pwsh

    steps:
      # -------------------------
      # Checkout repository
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------
      # Install Qt (MSVC 2022)
      # x64:   full archive set including opengl32sw/d3dcompiler for the packaging script
      # arm64: cross-compiled package; archives list omitted to avoid qmake.bat
      #        patching errors; IFW installed as a standalone tool (not an archive)
      # -------------------------
      - name: Install Qt 6.10.3 (x64, MSVC 2022)
        if: ${{ matrix.target.name == 'x64' }}
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: ${{ matrix.target.qt_arch }}
          tools: 'tools_vcredist,qt.tools.vcredist_64 tools_vcredist,qt.tools.vcredist_msvc2022_x64 tools_ifw'
          cache: true
          modules: 'qtmultimedia qtnetworkauth qtimageformats'
          add-tools-to-path: 'true'
          archives: 'qttranslations qttools qtsvg qtbase opengl32sw d3dcompiler_47'

      - name: Install Qt 6.10.3 (arm64, MSVC 2022)
        if: ${{ matrix.target.name == 'arm64' }}
        run: |
          pip install "aqtinstall==3.3.*"
          $qtDir = "D:\a\DMHelper\Qt"

          # x64 host tools required for cross-compile (windeployqt, qmake, etc.)
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_64 `
            --outputdir $qtDir `
            --modules qtmultimedia qtnetworkauth qtimageformats `
            --archives qttranslations qttools qtsvg qtbase opengl32sw d3dcompiler_47

          # ARM64 cross-compiled libs — manual call WITHOUT --autodesktop to avoid
          # the aqtinstall 3.3.0 regression that tries to patch a non-existent qmake.bat
          python -m aqt install-qt windows desktop 6.10.3 win64_msvc2022_arm64_cross_compiled `
            --outputdir $qtDir `
            --modules qtmultimedia qtnetworkauth qtimageformats

          # IFW and ARM64 vcredist tools
          python -m aqt install-tool windows desktop tools_ifw --outputdir $qtDir
          python -m aqt install-tool windows desktop tools_vcredist qt.tools.vcredist_msvc2022_arm64 --outputdir $qtDir

          # QT_ROOT_DIR must point to the ARM64 directory (read by the build script)
          "QT_ROOT_DIR=$qtDir\6.10.3\msvc2022_arm64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Add x64 Qt bin to PATH (windeployqt and other host tools run as x64)
          "$qtDir\6.10.3\msvc2022_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          # Add IFW bin to PATH (version-agnostic glob)
          $ifwBin = Get-ChildItem "$qtDir\Tools\QtInstallerFramework\*\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ifwBin) { $ifwBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }

      # -------------------------
      # Ensure 7-Zip exists
      # (Windows runner already has it, but we assert it)
      # -------------------------
      - name: Verify 7-Zip
        run: |
          Test-Path "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            throw "7-Zip not found"
          }

      # -------------------------
      # Check the full file tree
      # -------------------------
      - name: Debug Workspace output pre-build
        working-directory: ${{ runner.workspace }}
        run: |
          echo 'runner.workspace === ${{ runner.workspace }}'
          echo 'github.workspace === ${{ github.workspace }}'
          echo ${{env.QT_ROOT_DIR}}
          Get-ChildItem -Recurse -File

      # -------------------------
      # Run build & deploy script
      # -------------------------
      - name: Build DMHelper x64 (MSVC Release)
        if: ${{ matrix.target.name == 'x64' }}
        working-directory: ${{ github.workspace }}/DMHelper
        run: |
          "y" | pwsh -NoProfile -ExecutionPolicy Bypass -File buildanddeploy_msvc64_cmake.ps1

      - name: Build DMHelper arm64 (MSVC Release)
        if: ${{ matrix.target.name == 'arm64' }}
        working-directory: ${{ github.workspace }}/DMHelper
        run: |
          "y" | pwsh -NoProfile -ExecutionPolicy Bypass -File buildanddeploy_msvcarm64_cmake.ps1
      
      # -------------------------
      # Check the full file tree
      # -------------------------
      - name: Debug Workspace output post-build
        working-directory: ${{ runner.workspace }}
        run: |
          Get-ChildItem -Recurse -File

      # -------------------------
      # Smoke-test the built application (x64 only — ARM64 exe cannot run on x64 runner)
      # -------------------------
      - name: Smoke-test built application
        if: ${{ matrix.target.name == 'x64' }}
        working-directory: ${{ github.workspace }}/DMHelper
        run: |
          $exe = "bin64\packages\com.dmhelper.app\data\DMHelper.exe"
          if (-not (Test-Path $exe)) { throw "DMHelper.exe not found at $exe" }
          $output = & $exe --smoke-test --skip-opengl 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($null -ne $exitCode -and $exitCode -ne 0) { throw "Smoke test failed with exit code $exitCode" }
          if ($output -match '"passed"\s*:\s*false') { throw "Smoke test reported failures" }
        env:
          QT_QPA_PLATFORM: offscreen

      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload Installer (x64)
        if: ${{ matrix.target.name == 'x64' }}
        uses: actions/upload-artifact@v4
        with:
          name: DMHelper-Windows-Installer-x64
          path: DMHelper/DMHelper-64-bit-release-Installer.exe
          if-no-files-found: error

      - name: Upload ZIP Distribution (x64)
        if: ${{ matrix.target.name == 'x64' }}
        uses: actions/upload-artifact@v4
        with:
          name: DMHelper-Windows-Zip-x64
          path: DMHelper/DMHelper-64-bit-release.zip
          if-no-files-found: error

      - name: Upload Installer (arm64)
        if: ${{ matrix.target.name == 'arm64' }}
        uses: actions/upload-artifact@v4
        with:
          name: DMHelper-Windows-Installer-arm64
          path: DMHelper/DMHelper-arm64-release-Installer.exe
          if-no-files-found: error

      - name: Upload ZIP Distribution (arm64)
        if: ${{ matrix.target.name == 'arm64' }}
        uses: actions/upload-artifact@v4
        with:
          name: DMHelper-Windows-Zip-arm64
          path: DMHelper/DMHelper-arm64-release.zip
          if-no-files-found: error
